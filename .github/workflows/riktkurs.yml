name: Riktkurser (alla svenska bolag)

# Hämtar analytikers riktkurser och riktkurshistorik (Yahoo) för alla bolag i kurser.csv och sparar riktkurs_logg.csv
# (daglig ögonblicksbild, byggs på över tid) och riktkurs_hist.csv (historiska ändringar per analyshus).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: riktkurs
  cancel-in-progress: false

jobs:
  hamta:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Hämta data (låsta repot)
        uses: actions/checkout@v4
        with:
          repository: wilhelmjohn/insiderbot
          token: ${{ secrets.DATA_PAT }}
          ref: main
      - name: Hämta koden (öppna repot)
        uses: actions/checkout@v4
        with:
          path: _kod
          persist-credentials: false
      - name: Lägg in koden bredvid datan
        run: cp _kod/*.py _kod/*_mall.html .
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas yfinance lxml
      - name: Hämta riktkurser
        timeout-minutes: 50
        run: |
          set -o pipefail
          python -u riktkurs_data.py 2>&1 | tee riktkurs_logg.txt
      - name: Spara
        if: always()
        run: |
          git config user.name "insiderbot"
          git config user.email "insiderbot@users.noreply.github.com"
          for f in riktkurs_logg.csv riktkurs_hist.csv riktkurs_logg.txt; do git add "$f" || true; done
          git diff --cached --quiet || git commit -m "riktkurser $(date -u +%F)"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && break
            git rebase --abort 2>/dev/null || true
            sleep $((RANDOM % 20 + 5))
          done
