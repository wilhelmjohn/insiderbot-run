name: Divergens nordiska kurser

# Hämtar dagskurser för norska och danska storbolag (plus NOKSEK, DKKSEK och index) till Divergensscreen.
# Körs varje vardag efter stängning i Oslo och Köpenhamn, och kan startas manuellt.
on:
  workflow_dispatch:
  schedule:
    - cron: "50 16 * * 1-5"   # 18:50 svensk sommartid, 17:50 vintertid (efter stängning i Oslo och Köpenhamn)

concurrency:
  group: divergens_kurser
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  hamta:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Hämta data (låsta repot)
        uses: actions/checkout@v4
        with:
          repository: wilhelmjohn/insiderbot
          token: ${{ secrets.DATA_PAT }}
          ref: main
      - name: Hämta koden (öppna repot)
        uses: actions/checkout@v4
        with:
          path: _kod
          persist-credentials: false
      - run: cp _kod/divergens_kurser.py _kod/nordnet_lankar.py _kod/divergens_rapportdatum.py _kod/rantor.py .
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pandas yfinance requests lxml
      - run: python -u divergens_kurser.py 2>&1 | tee divergens_kurser_logg.txt
      - run: python -u divergens_rapportdatum.py || echo "Rapportdatum misslyckades"
      - run: python -u nordnet_lankar.py || echo "Nordnet-länkar misslyckades"
      - run: python -u rantor.py || echo "Räntor misslyckades"
      - name: Spara
        if: always()
        run: |
          git config user.name "insiderbot"
          git config user.email "insiderbot@users.noreply.github.com"
          for f in divergens_nordic.csv divergens_nordic_info.csv divergens_kurser_logg.txt nordnet_lankar.csv divergens_rapportdatum.csv rantor.csv rantor_logg.txt; do git add "$f" || true; done
          git diff --cached --quiet || git commit -m "divergens: nordiska kurser $(date -u +%F)"
          for i in 1 2 3 4; do
            if git pull --rebase -X theirs --autostash origin main && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((RANDOM % 15 + 5))
          done
          exit 1
