name: Placera rekar (historiska riktkursändringar)

# Läser Placeras dagliga rekommendationslistor (via deras sitemap; respekterar robots.txt, 1 anrop/sekund)
# och sparar tolkade riktkursändringar i riktkurs_nyhet.csv. Kan köras om: redan lästa sidor hoppas över.
on:
  # Vardagar varje timme 06-20 svensk tid: telegramlistan visar bara de senaste ~50 telegrammen
  schedule:
    - cron: "17 4-18 * * 1-5"
  workflow_dispatch:
    inputs:
      fran:
        description: "Första datum (ÅÅÅÅ-MM-DD)"
        default: "2021-01-01"
      till:
        description: "Sista datum (tomt = idag)"
        default: ""
      extra_urls:
        description: "Placera-telegram att läsa in (mellanslagsseparerade URL:er), för missade riktkursändringar"
        default: ""
      debug_urls:
        description: "Felsökning: mellanslagsseparerade Placera-URL:er att spara utdrag av"
        default: ""

permissions:
  contents: read

concurrency:
  group: placera
  cancel-in-progress: false

jobs:
  hamta:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Hämta data (låsta repot)
        uses: actions/checkout@v4
        with:
          repository: wilhelmjohn/insiderbot
          token: ${{ secrets.DATA_PAT }}
          ref: main
      - name: Hämta koden (öppna repot)
        uses: actions/checkout@v4
        with:
          path: _kod
          persist-credentials: false
      - run: cp _kod/*.py .
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 lxml
      - name: Läs sidor
        timeout-minutes: 320
        env:
          DEBUG_URLS: ${{ inputs.debug_urls }}
          EXTRA_URLS: ${{ inputs.extra_urls }}
          FRAN: ${{ inputs.fran }}
          TILL: ${{ inputs.till }}
        run: |
          set -o pipefail
          # schemalagd körning: bara de senaste 10 dagarna (äldre sidor är redan lästa)
          [ -z "$FRAN" ] && FRAN=$(date -u -d "10 days ago" +%F)
          python -u placera_arkiv.py "$FRAN" "$TILL" 2>&1 | tee placera_logg.txt
      - name: Spara
        if: always()
        run: |
          git config user.name "insiderbot"
          git config user.email "insiderbot@users.noreply.github.com"
          for f in riktkurs_nyhet.csv placera_sidor.csv placera_ejtolkat.txt placera_logg.txt placera_debug; do git add "$f" || true; done
          # bara loggen ändrad (vanligt för timkörningarna): inget att spara
          git diff --cached --quiet -- riktkurs_nyhet.csv placera_sidor.csv placera_ejtolkat.txt placera_debug && exit 0
          git commit -m "placera rekar $(date -u +%F)"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && break
            git rebase --abort 2>/dev/null || true
            sleep $((RANDOM % 20 + 5))
          done
