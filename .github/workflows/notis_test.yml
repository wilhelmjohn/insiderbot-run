name: Prov-notis

# Skickar ett testmeddelande till ntfy (kontrollerar bland annat klicklänken till bevakningssidan). Manuell.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skicka:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Hämta data (låsta repot)
        uses: actions/checkout@v4
        with:
          repository: wilhelmjohn/insiderbot
          token: ${{ secrets.DATA_PAT }}
          ref: main
      - name: Hämta koden (öppna repot)
        uses: actions/checkout@v4
        with:
          path: _kod
          persist-credentials: false
      - name: Lägg in koden bredvid datan
        run: cp _kod/*.py _kod/*_mall.html .
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pandas matplotlib
      - env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python notis.py --test
      - name: Kontrollera hur ntfy tog emot den
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          sleep 3
          curl -s "https://ntfy.sh/$NTFY_TOPIC/json?poll=1&since=3m" | python3 -c "
          import sys,json
          for l in sys.stdin:
              d=json.loads(l); d.pop('topic',None); d.pop('id',None)
              if d.get('event')=='message': print(json.dumps(d,ensure_ascii=False,indent=1))
          " | tee notis_test_logg.txt
      - name: Spara loggen
        if: always()
        run: |
          git config user.name "insiderbot"
          git config user.email "insiderbot@users.noreply.github.com"
          git add notis_test_logg.txt || true
          git diff --cached --quiet || git commit -m "Logg prov-notis"
          for i in 1 2 3; do git pull --rebase --autostash origin main && git push && break; sleep 5; done
