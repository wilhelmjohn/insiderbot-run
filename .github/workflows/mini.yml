name: Nordnet mini futures
# Hämtar vilka underliggande som har mini futures (Nordnet Markets) till nordnet_mini.csv i datarepot.
# Startas manuellt; ras.yml kör samma skript före bygget.
on:
  workflow_dispatch:
    inputs:
      alla:
        description: "Alla emittenter (nordnet_mini_alla.csv), inte bara Nordnet Markets"
        type: boolean
        default: false
concurrency:
  group: ras
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  hamta:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: wilhelmjohn/insiderbot
          token: ${{ secrets.DATA_PAT }}
          ref: main
      - uses: actions/checkout@v4
        with:
          path: _kod
          persist-credentials: false
      - run: cp _kod/mini_hamta.py .
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests pandas
      - run: python -u mini_hamta.py
        env:
          MINI_ALLA: ${{ inputs.alla && '1' || '0' }}
      - name: Spara
        run: |
          git config user.name "insiderbot"
          git config user.email "insiderbot@users.noreply.github.com"
          git rm -rq --ignore-unmatch hamtat/mini_prov
          for f in nordnet_mini.csv nordnet_mini_alla.csv; do [ -f "$f" ] && git add "$f"; done
          git diff --cached --quiet || git commit -m "mini: Nordnets mini futures $(TZ=Europe/Stockholm date +'%F %H:%M')"
          for i in 1 2 3; do git pull --rebase -X theirs --autostash origin main && git push && exit 0; sleep 7; done; exit 1
