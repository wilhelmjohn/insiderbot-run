name: Placera förtest (robots.txt och provsidor)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prov:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Hämta data (låsta repot)
        uses: actions/checkout@v4
        with:
          repository: wilhelmjohn/insiderbot
          token: ${{ secrets.DATA_PAT }}
          ref: main
      - name: Hämta koden (öppna repot)
        uses: actions/checkout@v4
        with:
          path: _kod
          persist-credentials: false
      - run: cp _kod/*.py .
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Förtest
        run: python -u placera_prov.py 2>&1 | tee placera_prov.txt
      - name: Spara
        if: always()
        run: |
          git config user.name "insiderbot"
          git config user.email "insiderbot@users.noreply.github.com"
          git add placera_prov placera_prov.txt || true
          git diff --cached --quiet || git commit -m "placera förtest"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && break
            sleep $((RANDOM % 20 + 5))
          done
