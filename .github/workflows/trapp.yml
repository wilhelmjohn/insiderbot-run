name: trapp
on:
  workflow_dispatch:
  schedule:
    - cron: "10 16 * * 1-5"   # ca 18:10 svensk tid, efter stängning
concurrency:
  group: volscreen
permissions:
  contents: read
jobs:
  hamta:
    runs-on: ubuntu-latest
    steps:
      - name: Hämta data (låsta repot)
        uses: actions/checkout@v4
        with:
          repository: wilhelmjohn/insiderbot
          token: ${{ secrets.DATA_PAT }}
          ref: main
      - name: Hämta koden (öppna repot)
        uses: actions/checkout@v4
        with:
          path: _kod
          persist-credentials: false
      - name: Lägg in koden bredvid datan
        run: cp _kod/*.py _kod/*_mall.html .
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pandas yfinance
      - run: python -u volhamta.py "$(paste -sd, trapp_tickers.txt)"
      - run: pip install numpy requests
      - name: Lägesändringar och push
        env:
          NTFY_TOPIC: ""   # avstängd 2026-10-22: bara Divergensscreen skickar ntfy (sätt tillbaka secrets.NTFY_TOPIC för att slå på)
        run: python -u trapp_lage.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add volscreen_ohlc.csv volscreen_info.csv volscreen_utdelning.csv trapp_lage.json
          git diff --cached --quiet || git commit -m "trapp: slutkurser $(date -u +%F)"
          for i in 1 2 3 4; do
            if git pull --rebase -X theirs --autostash origin main && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((RANDOM % 15 + 5))
          done
          exit 1
