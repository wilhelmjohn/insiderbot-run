name: Sidnotis

# Skickar en kort push att bevakningssidan är uppdaterad. Startas av kvällsuppgiften efter publiceringen.
on:
  workflow_dispatch:
    inputs:
      text:
        description: "Meddelandetext"
        required: false
        default: "Kvällsuppdateringen är klar."
      titel:
        description: "Rubrik (tomt = Bevakningssidan uppdaterad)"
        required: false
        default: ""
      lank:
        description: "Länk för knappen och tryck på notisen (tomt = bevakningssidan)"
        required: false
        default: ""
      prio:
        description: "Prioritet 1-5 (tomt = 2)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  skicka:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Hämta data (låsta repot)
        uses: actions/checkout@v4
        with:
          repository: wilhelmjohn/insiderbot
          token: ${{ secrets.DATA_PAT }}
          ref: main
      - name: Hämta koden (öppna repot)
        uses: actions/checkout@v4
        with:
          path: _kod
          persist-credentials: false
      - name: Lägg in koden bredvid datan
        run: cp _kod/*.py _kod/*_mall.html .
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pandas matplotlib
      - env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEXT: ${{ inputs.text }}
          TITEL: ${{ inputs.titel }}
          LANK: ${{ inputs.lank }}
          PRIO: ${{ inputs.prio }}
        run: |
          args=(--sida "$TEXT")
          [ -n "$TITEL" ] && args+=(--titel "$TITEL")
          [ -n "$LANK" ] && args+=(--lank "$LANK")
          [ -n "$PRIO" ] && args+=(--prio "$PRIO")
          python notis.py "${args[@]}"
